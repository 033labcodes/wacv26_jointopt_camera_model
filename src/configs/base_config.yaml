# Weights & Biases設定
wandb_project: 0723_no_pretrain

# Dataset settings
dataset_name: HFD100_Leaves
# dataset_name: HFD100_Flower
# dataset_name: HFD100_Scenes
# HDF5 (MatFlower60.h5 等) が格納されているディレクトリ
# 環境変数 HFD100_DATA_DIR でも指定可能
data_dir: ./data
batch_size: 32
num_workers: 4

# Camera settings
camera_name: sRGB
# camera_name: Sony Nex5N
# camera_name: Canon500D
# camera_name: NikonD80
# camera_name: Olympus EPL2
# camera_name: gray

# Training settings
epochs: 300
train_css: True
css_lr: 0.0001
train_ccm: True
ccm_lr: 0.0001

# Gamma settings
# gamma_model_type: GradientLimitedGammaV1
gamma_model_type: GradientLimitedGammaV2
# gamma_model_type: GammaEpsAdd
# gamma_model_type: GammaEpsClip
gamma_eps: 1e-6
# gradient_clipping: 851.735
gradient_clipping: 1000
train_gamma: True
gamma_lr: 0.0001

train_classification: True
classification_lr: 0.0001
classification_dropout_p: 0.5

